<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf6ef;
    --panel: #ffffff;
    --panel-2: #f3ede0;
    --line: #e4dbc8;
    --text: #2b2620;
    --text-dim: #7a7264;
    --accent: #e07b3f;
    --accent-dim: #f0c9ab;
    --teal: #285e56;
    --danger: #c94f3f;
    --ok: #3f8a63;
    --mono: 'Karla', -apple-system, sans-serif;
    --display: 'Poppins', -apple-system, sans-serif;
    --sans: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 40px 24px;
  }
  .wrap{ width:100%; max-width: 740px; }
  .eyebrow{
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 8px;
  }
  h1{ font-family: var(--display); font-size: 28px; margin: 0 0 6px 0; font-weight: 650; color: var(--teal); letter-spacing: -0.01em; }
  h2{ font-family: var(--display); font-size: 17px; margin: 0 0 4px 0; font-weight: 600; color: var(--teal); }
  .sub{ color: var(--text-dim); font-size: 14.5px; margin-bottom: 28px; line-height:1.55; }
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 2px 10px rgba(40,94,86,0.05);
  }
  label{ display:block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; margin-top: 16px; font-weight: 500; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=email], input[type=password], input[type=url], textarea{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
  }
  input:focus, textarea:focus{ border-color: var(--accent); }
  textarea{ font-size: 14px; line-height:1.6; resize: vertical; min-height: 160px; }
  textarea.locked{ opacity:0.75; cursor:not-allowed; border-style:dashed; }
  textarea.locked:focus{ outline:none; box-shadow:none; }
  .lock-note{ font-size:12px; margin-top:6px; display:flex; align-items:center; gap:6px; }
  .lock-warn{ font-size:12.5px; line-height:1.55; margin-top:8px; padding:10px 12px; border-radius:6px;
    background:rgba(176,120,96,0.10); border:1px solid rgba(176,120,96,0.35); }
  .confirm-box{ margin-top:16px; padding:14px 16px; border-radius:8px;
    background:rgba(176,120,96,0.10); border:1px solid rgba(176,120,96,0.45); }
  .confirm-box p{ margin:0 0 12px; font-size:13.5px; line-height:1.6; }
  .confirm-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .confirm-row .btn{ margin-top:0; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--accent); color: #fff; border:none;
    font-weight: 600; font-size: 14px; padding: 12px 22px;
    border-radius: 7px; cursor:pointer; margin-top: 22px;
    font-family: var(--sans);
  }
  .btn:hover{ filter: brightness(1.06); }
  .btn:disabled{ background: var(--line); color: var(--text-dim); cursor:not-allowed; }
  .btn-ghost{ background: transparent; border: 1px solid var(--line); color: var(--text-dim); }
  .meta{
    font-size: 12.5px; color: var(--text-dim);
    display:flex; justify-content: space-between; margin-top: 18px;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
  .timer-bar{
    position: sticky; top:0; z-index: 5;
    display:flex; align-items:center; justify-content: space-between;
    background: var(--teal); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 18px;
    color: #fdf9f2;
  }
  .timer{ font-family: var(--display); font-size: 24px; font-weight: 650; letter-spacing: 0.02em; }
  .timer.low{ color: #ffb199; }
  .flag{ font-size: 12px; color: #cfe4de; }
  .flag.warn{ color: #ffb199; font-weight: 600; }
  .banner{
    background: #fbe9e4; border:1px solid var(--danger); color: #8f3a2c;
    border-radius: 7px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display:none;
  }
  .banner.show{ display:block; }
  .task-prompt{
    background: var(--panel-2); border:1px solid var(--line); border-radius: 8px;
    padding: 16px; font-size: 14px; line-height:1.6; margin-bottom: 10px; white-space: pre-wrap;
  }
  .q-block{ margin-bottom: 26px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .q-block:last-of-type{ border-bottom: none; }
  .optional-pill{
    display:inline-block; font-size: 10.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    background: var(--accent-dim); color: #8a3e10; border-radius: 10px; padding: 2px 8px; margin-left: 8px; vertical-align: middle;
  }
  .center{ text-align:center; }
  .ok-icon{ font-size: 40px; margin-bottom: 12px; }
  table{ width:100%; border-collapse: collapse; font-size: 12.5px; }
  th, td{ text-align:left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th{ color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
  .pill{ display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight:600; }
  .pill.submitted{ background: #e2f1e8; color: var(--ok); }
  .pill.progress{ background: var(--accent-dim); color: #8a3e10; }
  .pill.violations{ background: #fbe9e4; color: var(--danger); }
  .footer-link{ text-align:center; margin-top: 18px; }
  .footer-link a{ color: var(--text-dim); font-size: 12px; text-decoration:none; border-bottom: 1px dotted var(--text-dim); }
  .config-warn{
    background:#fbe9e4; border:1px solid var(--danger); color:#8f3a2c; border-radius:8px;
    padding:12px 14px; font-size:13px; margin-bottom:16px;
  }
  /* Question 1 embedded evidence styles */
  .ev-box{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin:12px 0; }
  .ev-label{ font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--teal); margin-bottom:10px; }
  .chart-row{ display:flex; gap:32px; align-items:flex-end; margin-bottom:10px; }
  .bar-group{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bar-pair{ display:flex; gap:5px; align-items:flex-end; }
  .bar{ width:30px; border-radius:3px 3px 0 0; }
  .bar-num{ font-size:10px; font-weight:600; text-align:center; color:var(--text); }
  .bar-tick{ font-size:10px; color:var(--text-dim); text-align:center; }
  .group-lbl{ font-size:11px; color:var(--text-dim); text-align:center; margin-top:4px; }
  .legend-row{ display:flex; gap:16px; margin-top:8px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); }
  .legend-swatch{ width:10px; height:10px; border-radius:2px; }
  .ev-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:4px; }
  .ev-table th{ background:var(--panel-2); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-dim); padding:6px 8px; border-bottom:1px solid var(--line); }
  .ev-table td{ padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .ev-table tr:last-child td{ border-bottom:none; }
  .ev-table tr.hl td{ background:#f0f7f4; }
  .sig-hi{ display:inline-block; background:#e2f1e8; color:#2e6b47; font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px; margin-left:4px; }
  .sig-lo{ display:inline-block; background:#fef3e2; color:#8a5a10; font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px; margin-left:4px; }
  .eff{ font-weight:600; color:var(--teal); }
  .q-part{ margin-top:12px; font-size:13.5px; font-weight:600; color:var(--text); }
  .q-part-body{ font-size:13px; color:var(--text-dim); margin-top:3px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const CONFIG = {
  TASK_TITLE: "Written Test Task",
  INTRO_TEXT: `You'll have 90 minutes once you click Start. You'll answer one question at a time. Questions 1-3 are required. Questions 1 and 2 each have two parts, and Part A is submitted separately: once you submit it, it is locked and you cannot return to it. Everything else stays editable until you submit the test. Tab switches and window closures are logged for Questions 1 and 2 only, so please stay on this page once you begin.`,
  DEADLINE_ISO: "2026-09-15T23:59:00",
  DURATION_MINUTES: 90,
  ADMIN_PASSWORD: "changeme123",
  BACKEND_URL: "https://script.google.com/macros/s/AKfycbxmNxzrE4BnHyUkrubLPiPxfwPtEb70AjOtXOW204NgNMyXRjKBSCnjQFUQeTEw2u_B/exec",

  QUESTIONS: [
    {
      id: "q1",
      type: "reveal",
      label: "Question 1: effect size selection",
      optional: false,
      // Always visible: context + Part A only. No evidence shown yet.
      contextHtml: `<p style="margin:0 0 14px;font-size:13px;line-height:1.6;font-style:italic;color:var(--text-dim);">There's no single right answer here. We're more interested in how you think through the problem than which option you pick. </p>
<p style="margin:0 0 14px;font-size:13.5px;line-height:1.65;"><strong>Context.</strong> You are building a cost-effectiveness model for a radio family planning campaign being rolled out in Nigeria. The evidence base is a randomised controlled trial conducted in Burkina Faso (Glennerster et al., 2026). The trial evaluated a 2.5-year radio campaign promoting modern contraception across 16 radio station clusters: 8 treatment, 8 control. The study reports two main effect sizes on modern contraceptive prevalence rate (mCPR).</p>
<div class="q-part">Part A</div>
<div class="q-part-body"><p style="margin:0 0 10px;">The paper reports:</p>
<ul style="margin:0 0 12px;padding-left:20px;">
  <li style="margin-bottom:4px;">a 5.9 percentage-point increase in mCPR among all women in the study population; and</li>
  <li>a 7.7 percentage-point increase among women who had a radio at baseline.</li>
</ul>
<p style="margin:0 0 10px;">You are using this evidence to estimate the impact of a radio campaign in a new country. <b> Which effect size and population group would you use in the model, and how would you translate the study result to the new setting?</b></p>
<p style="margin:0 0 8px;">In your answer, explain:</p>
<ul style="margin:0;padding-left:20px;">
  <li style="margin-bottom:4px;">why your selected effect size and population are appropriate;</li>
  <li style="margin-bottom:4px;">what information about the study and the new setting you would want to consider;</li>
  <li style="margin-bottom:4px;">whether you would make any adjustments to the study estimate; and</li>
  <li>how you would account for uncertainty in your choice.</li>
</ul></div>`,
      // Revealed only once Part A has an answer:
      evidenceHtml: `<div class="ev-box">
  <div class="ev-label">Figure: impact on mCPR (endline survey, December 2018)</div>
  <div class="chart-row">
    <div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">All women (N = 6,728)</div>
      <div class="bar-pair">
        <div class="bar-group">
          <div class="bar-num">29.5%</div>
          <div class="bar" style="height:80px;background:#5a7fc2;"></div>
          <div class="bar-tick">Control</div>
        </div>
        <div class="bar-group">
          <div class="bar-num">35.5%</div>
          <div class="bar" style="height:96px;background:#b07860;"></div>
          <div class="bar-tick">Treat.</div>
        </div>
      </div>
      <div class="group-lbl">+5.9pp</div>
    </div>
    <div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">Women with a radio at baseline (N = 3,877)</div>
      <div class="bar-pair">
        <div class="bar-group">
          <div class="bar-num">29.1%</div>
          <div class="bar" style="height:79px;background:#5a7fc2;"></div>
          <div class="bar-tick">Control</div>
        </div>
        <div class="bar-group">
          <div class="bar-num">36.7%</div>
          <div class="bar" style="height:99px;background:#b07860;"></div>
          <div class="bar-tick">Treat.</div>
        </div>
      </div>
      <div class="group-lbl">+7.6pp</div>
    </div>
  </div>
  <div class="legend-row">
    <div class="legend-item"><div class="legend-swatch" style="background:#5a7fc2;"></div>Non-campaign areas</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#b07860;"></div>Campaign areas</div>
  </div>
</div>

<div class="ev-box">
  <div class="ev-label">Selected data from Glennerster et al., 2023</div>
  <table class="ev-table">
    <thead>
      <tr>
        <th style="width:36%;">Outcome</th>
        <th>Population<br>control mean</th>
        <th>Population<br>effect</th>
        <th>Radio owners<br>control mean</th>
        <th>Radio owners<br>effect</th>
      </tr>
    </thead>
    <tbody>
      <tr class="hl">
        <td><strong>Currently using modern contraception (mCPR)</strong></td>
        <td>29.5%</td>
        <td class="eff">+0.059**</td>
        <td>29.1%</td>
        <td class="eff">+0.076***</td>
      </tr>
      <tr>
        <td>Has access to a radio in her household</td>
        <td>55%</td>
        <td>-</td>
        <td>100%</td>
        <td>-</td>
      </tr>
      <tr>
        <td>Listen to the radio in the last week</td>
        <td>29.3%</td>
        <td>-</td>
        <td>45.1%</td>
        <td>-</td>
      </tr>
    </tbody>
  </table>
  <div style="font-size:10.5px;color:var(--text-dim);margin-top:8px;">* p&lt;0.1 &nbsp;** p&lt;0.05 &nbsp;*** p&lt;0.01. &nbsp;Endline survey data, December 2018.</div>
</div>`,
      partBPrompt: `<div class="q-part">Part B</div>
<div class="q-part-body">Having reviewed the evidence above, would you change your answer?</div>`
    },
    {
      id: "q2",
      type: "reveal",
      label: "Question 2: Supply analysis",
      optional: false,
      /* Part A only. The results table and Part B stay hidden until Part A is submitted. */
      contextHtml: `<div class="q-part">Part A</div>
<div class="q-part-body"><p style="margin:0 0 10px;"><strong>Context.</strong> We are considering expanding to Country A and working only within specific subregions (provinces). We would like to know whether supply levels are sufficient for demand generation, since we expect our campaigns will increase demand for contraceptives.</p>
<p style="margin:0 0 8px;">You are given a dataset covering the last 12 months at a monthly scale, containing:</p>
<ul style="margin:0 0 12px;padding-left:20px;">
  <li style="margin-bottom:4px;">quantity available at the end of the month, per facility and per contraceptive method;</li>
  <li style="margin-bottom:4px;">monthly consumption, per facility and per contraceptive method; and</li>
  <li>the province the facility is located in.</li>
</ul>
<p style="margin:0 0 12px;">The data is private and cannot be shared with AI.</p>
<p style="margin:0 0 10px;"><strong>Create an indicator to assess supply across the regions FEM would work in.</strong></p>
<p style="margin:0;">List the data sources you would use, any indicators you may develop, and any software tools (Python, R, Google Sheets, etc.) you would use for the analysis.</p></div>`,
      /* Revealed only once Part A has been submitted: */
      evidenceHtml: `<div class="q-part">Part B</div>
<div class="q-part-body" style="margin-bottom:10px;">Outputs from a supply analysis are shown in the table below.</div>
<div class="ev-box">
  <div class="ev-label">Supply analysis outputs, by province</div>
  <table class="ev-table">
    <thead>
      <tr>
        <th style="width:22%;">Province</th>
        <th>% of family planning facilities reporting data</th>
        <th>Average % of facilities with at least 3 methods stocked</th>
        <th>Average % of facilities stocked out</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Province A</td><td>82%</td><td>63%</td><td>11%</td></tr>
      <tr><td>Province B</td><td>47%</td><td>63%</td><td>6%</td></tr>
      <tr><td>Province C</td><td>59%</td><td>64%</td><td>12%</td></tr>
      <tr><td>Province D</td><td>88%</td><td>84%</td><td>2%</td></tr>
      <tr><td>Province E</td><td>12%</td><td>79%</td><td>11%</td></tr>
      <tr><td>Province F</td><td>38%</td><td>63%</td><td>17%</td></tr>
      <tr><td>Province G</td><td>47%</td><td>67%</td><td>4%</td></tr>
    </tbody>
  </table>
</div>`,
      partBPrompt: `<div class="q-part-body"><p style="margin:0 0 8px;">Which provinces would you recommend to work in?</p>
<p style="margin:0 0 8px;">List 1-2 limitations of this result.</p>
<p style="margin:0;">Is there any additional information that could strengthen your recommendation on where to implement?</p></div>`
    },
    {
      id: "q3",
      type: "linktext",
      label: "Question 3: Create a BOTEC for mass media and intimate partner violence",
      optional: false,
      linkPrompt: `Create a back-of-the-envelope calculation (BOTEC) in Google Sheets estimating the cost-effectiveness of a radio mass media campaign aimed at reducing intimate partner violence. Use your own numbers for inputs - you will not be assessed on the specific values chosen, only on your reasoning and model structure. Once complete, paste a shareable link below (ensure permissions are set to "Anyone with the link can view").`,
      textPrompt: `In the box below, summarise: (a) your key takeaways from the model, (b) the main assumptions you made and why, and (c) the most important limitations of your approach.`
    }
  ]
};

const app = document.getElementById('app');
let record = null;
let timerInterval = null;
let violations = 0;
const usingBackend = !!CONFIG.BACKEND_URL;

function fmtTime(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(s/60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function keyFor(email){ return 'submission:' + email.trim().toLowerCase(); }

async function backendPost(payload){
  const res = await fetch(CONFIG.BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}
async function backendGet(params){
  const url = new URL(CONFIG.BACKEND_URL);
  Object.entries(params).forEach(([k,v])=> url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  return res.json();
}

async function saveRecord(rec){
  if(usingBackend){
    await backendPost({ action:'save', record: rec });
  } else {
    await window.storage.set(keyFor(rec.email), JSON.stringify(rec), true);
  }
}
async function loadRecord(email){
  if(usingBackend){
    const res = await backendGet({ action:'get', email });
    return res && res.found ? res.record : null;
  } else {
    try{
      const res = await window.storage.get(keyFor(email), true);
      return res ? JSON.parse(res.value) : null;
    }catch(e){ return null; }
  }
}
async function listRecords(){
  if(usingBackend){
    const res = await backendGet({ action:'list', token: CONFIG.ADMIN_PASSWORD });
    return res && res.records ? res.records : [];
  } else {
    try{
      const listRes = await window.storage.list('submission:', true);
      const keys = listRes ? listRes.keys : [];
      const records = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          if(r) records.push(JSON.parse(r.value));
        }catch(e){}
      }
      return records;
    }catch(e){ return []; }
  }
}

function pastDeadline(){ return new Date() > new Date(CONFIG.DEADLINE_ISO); }

function renderEntry(){
  const deadlineStr = new Date(CONFIG.DEADLINE_ISO).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'});
  app.innerHTML = `
    ${!usingBackend ? `<div class="config-warn">BACKEND_URL isn't set. Submissions stored in artifact only.</div>` : ''}
    <div class="eyebrow">FEM Data Analyst Test Portal</div>
    <h1>${CONFIG.TASK_TITLE}</h1>
    <div class="sub">${CONFIG.INTRO_TEXT}</div>
    <div class="panel">
      <label>Full name</label>
      <input type="text" id="in-name" placeholder="Jane Candidate">
      <label>Email</label>
      <input type="email" id="in-email" placeholder="jane@example.com">
      <label>GitHub or a project you're most proud of <span style="font-weight:400;">(optional)</span></label>
      <input type="url" id="in-github" placeholder="https://github.com/...">
      <button class="btn" id="btn-start">Start test</button>
      <div id="entry-error" style="color:var(--danger); font-size:13px; margin-top:10px; display:none;"></div>
    </div>
  `;
  document.getElementById('btn-start').onclick = handleStart;
}

async function handleStart(){
  const name = document.getElementById('in-name').value.trim();
  const email = document.getElementById('in-email').value.trim();
  const preTestLink = document.getElementById('in-github').value.trim();
  const errEl = document.getElementById('entry-error');
  errEl.style.display = 'none';

  if(!name || !email || !email.includes('@')){
    errEl.textContent = 'Please enter your name and a valid email.';
    errEl.style.display = 'block';
    return;
  }
  if(pastDeadline()){
    errEl.textContent = 'The deadline to start this test has passed.';
    errEl.style.display = 'block';
    return;
  }
  if(!usingBackend && typeof window.storage === 'undefined'){
    errEl.textContent = 'Setup error: BACKEND_URL is not set and fallback storage only works inside Claude.ai.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = 'Starting…';

  try{
    let existing = await loadRecord(email);
    if(existing && existing.status === 'submitted'){
      renderAlreadySubmitted(existing);
      return;
    }
    if(existing && existing.status === 'in_progress'){
      record = existing;
      if(preTestLink) record.preTestLink = preTestLink;
    } else {
      record = {
        name, email,
        preTestLink,
        startTime: new Date().toISOString(),
        durationMinutes: CONFIG.DURATION_MINUTES,
        answers: {},
        violations: 0,
        violationLog: [],
        status: 'in_progress',
        submittedTime: null
      };
      await saveRecord(record);
    }
    violations = record.violations || 0;
    renderTask();
    requestFullscreenSoft();
    attachMonitors();
  } catch(err){
    errEl.textContent = 'Could not connect to the backend. (' + err.message + ')';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Start test';
  }
}

function renderAlreadySubmitted(rec){
  app.innerHTML = `
    <div class="panel center">
      <div class="ok-icon">✓</div>
      <h1>Already submitted</h1>
      <div class="sub">This email already has a submitted response, recorded ${new Date(rec.submittedTime).toLocaleString()}. If this is a mistake, contact whoever sent you this link.</div>
    </div>
  `;
}

function timeRemainingMs(){
  const duration = Number(record.durationMinutes) || CONFIG.DURATION_MINUTES;
  const start = new Date(record.startTime).getTime();
  const end = start + duration*60000;
  return end - Date.now();
}

let currentPage = 0;

function renderTask(){
  currentPage = 0;
  app.innerHTML = `
    <div class="timer-bar">
      <div>
        <div style="font-size:12px;opacity:0.85">${record.name} · ${record.email}</div>
        <div class="timer" id="timer">--:--</div>
      </div>
      <div style="text-align:right">
        <div class="flag">Autosaves as you type</div>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="progress-label" id="progress-label"></div>
    <div class="panel" id="qcontainer"></div>
    <div id="submit-error" style="color:var(--danger); font-size:13px; margin-top:10px; display:none;"></div>
  `;
  renderQuestionPage(currentPage);
  updateFlagUI();
  tick();
  timerInterval = setInterval(tick, 1000);
}

function questionBlockHtml(q){
  const val = (record.answers && record.answers[q.id]) || '';

  if(q.type === 'link'){
    return `
      <h2>${q.label}${q.optional ? '<span class="optional-pill">Optional</span>' : ''}</h2>
      <div class="sub" style="margin-bottom:8px;">${q.prompt}</div>
      <input type="url" data-qid="${q.id}" class="q-input" placeholder="https://..." value="${val.replace(/"/g,'&quot;')}">`;
  }

  if(q.type === 'linktext'){
    const linkVal = (record.answers && record.answers[q.id + '_link']) || '';
    const textVal = (record.answers && record.answers[q.id + '_text']) || '';
    return `
      <h2>${q.label}${q.optional ? '<span class="optional-pill">Optional</span>' : ''}</h2>
      <div class="sub" style="margin-bottom:10px;white-space:normal;">${q.linkPrompt}</div>
      <label>Google Sheets link</label>
      <input type="url" data-qid="${q.id}_link" class="q-input" placeholder="https://docs.google.com/spreadsheets/..." value="${linkVal.replace(/"/g,'&quot;')}">
      <label style="margin-top:16px;">Summary of takeaways, assumptions and limitations</label>
      <div class="sub" style="margin-bottom:6px;font-size:13px;">${q.textPrompt}</div>
      <textarea data-qid="${q.id}_text" class="q-input no-paste" placeholder="Write your summary here...">${textVal}</textarea>
      <div class="sub" style="margin-top:4px;margin-bottom:0;font-size:12px;">Pasting is disabled in the summary field. Please type your answer directly.</div>`;
  }

  if(q.type === 'reveal'){
    const aVal = (record.answers && record.answers[q.id + 'a']) || '';
    const bVal = (record.answers && record.answers[q.id + 'b']) || '';
    const revealed = isRevealed(q);
    /* Part A is one-way: once submitted it becomes read-only so the candidate
       cannot revise it in light of the evidence revealed afterwards. Every
       other field in the test stays editable until final submission.
       Part B is not rendered at all until Part A is submitted, so there is no
       hidden markup for a candidate to find. */
    const partA = `
      <h2>${q.label}</h2>
      <div class="sub" style="margin-bottom:0;white-space:normal;">${q.contextHtml}</div>
      <textarea data-qid="${q.id}a" class="q-input no-paste${revealed ? ' locked' : ''}"${revealed ? ' readonly aria-readonly="true"' : ''} placeholder="Write your answer to Part A here...">${aVal}</textarea>`;

    if(!revealed){
      return `${partA}
      <div class="sub" style="margin-top:4px;margin-bottom:0;font-size:12px;">Pasting is disabled. Please type your answer directly.</div>
      <div class="lock-warn"><strong>Part A can only be submitted once.</strong> When you submit it, your answer is locked and cannot be edited or returned to, and Part B will unlock. Every other question in the test stays editable until you submit at the end.</div>
      <button class="btn" id="btn-submit-parta" style="margin-top:14px;">Submit Part A</button>
      <div id="parta-error" style="color:var(--danger); font-size:13px; margin-top:10px; display:none;"></div>
      <div id="confirm-lock" class="confirm-box" style="display:none;">
        <p><strong>Submit Part A?</strong> Your answer will be locked and you will not be able to change it or come back to it. Part B will then unlock.</p>
        <div class="confirm-row">
          <button class="btn" id="btn-confirm-lock" style="margin-top:0;">Yes, submit Part A</button>
          <button class="btn btn-ghost" id="btn-cancel-lock" style="margin-top:0;">Keep editing</button>
        </div>
      </div>`;
    }

    return `${partA}
      <div class="lock-note" style="color:var(--text-dim);">Part A is submitted and locked. Your other answers can still be edited until you submit the test.</div>
      <div id="reveal-section" style="margin-top:22px;">
        <div class="sub" style="margin-bottom:0;white-space:normal;">${q.evidenceHtml}${q.partBPrompt}</div>
        <textarea data-qid="${q.id}b" class="q-input no-paste" placeholder="Write your answer to Part B here...">${bVal}</textarea>
        <div class="sub" style="margin-top:4px;margin-bottom:0;font-size:12px;">Pasting is disabled. Please type your answer directly.</div>
      </div>`;
  }

  /* default: text with prompt as HTML */
  return `
    <h2>${q.label}${q.optional ? '<span class="optional-pill">Optional</span>' : ''}</h2>
    <div class="sub" style="margin-bottom:8px;white-space:normal;">${q.prompt}</div>
    <textarea data-qid="${q.id}" class="q-input no-paste" placeholder="Write your answer here...">${val}</textarea>
    <div class="sub" style="margin-top:4px;margin-bottom:0;font-size:12px;">Pasting is disabled in this field. Please type your answer directly.</div>`;
}

function renderQuestionPage(idx){
  const total = CONFIG.QUESTIONS.length;
  const q = CONFIG.QUESTIONS[idx];
  const isLast = idx === total - 1;

  document.getElementById('progress-label').textContent = `Question ${idx + 1} of ${total}`;

  const needsPartASubmit = q.type === 'reveal' && !isRevealed(q);

  const container = document.getElementById('qcontainer');
  container.innerHTML = `
    <div class="q-block" style="border-bottom:none;margin-bottom:0;padding-bottom:0;">
      ${questionBlockHtml(q)}
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px;">
      <button class="btn btn-ghost" id="btn-back" style="margin-top:0;${idx===0 ? 'visibility:hidden;' : ''}">Back</button>
      ${isLast
        ? `<button class="btn" id="btn-submit" style="margin-top:0;">Submit now</button>`
        : `<button class="btn" id="btn-next" style="margin-top:0;${needsPartASubmit ? 'display:none;' : ''}">Next</button>`}
    </div>
  `;

  attachQuestionListeners(q);

  document.getElementById('btn-back').onclick = ()=> goToPage(idx - 1);
  if(isLast){
    document.getElementById('btn-submit').onclick = ()=> attemptSubmit(false);
  } else {
    document.getElementById('btn-next').onclick = ()=> goToPage(idx + 1);
  }

  /* Part A has its own submit button directly beneath it, so the candidate
     never scrolls past unrevealed content to find it. */
  if(needsPartASubmit){
    const confirmBox = document.getElementById('confirm-lock');
    const err = document.getElementById('parta-error');

    document.getElementById('btn-submit-parta').onclick = ()=>{
      flushCurrentInputs();
      const aVal = (record.answers && record.answers[q.id + 'a']) || '';
      if(!aVal.trim()){
        err.textContent = 'Please answer Part A before submitting.';
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      /* Ask before locking, so nobody loses the chance to edit by accident. */
      confirmBox.style.display = 'block';
      confirmBox.scrollIntoView({ behavior:'smooth', block:'center' });
    };

    document.getElementById('btn-cancel-lock').onclick = ()=>{
      confirmBox.style.display = 'none';
    };

    document.getElementById('btn-confirm-lock').onclick = async ()=>{
      flushCurrentInputs();
      await revealSection(q);
    };
  }
}

function goToPage(idx){
  flushCurrentInputs();
  currentPage = idx;
  document.getElementById('submit-error').style.display = 'none';
  renderQuestionPage(currentPage);
}

/* A field is locked once its question has been submitted. Checked here as well
   as in the markup, so removing the readonly attribute in devtools still
   cannot overwrite an answer that has already been committed. */
function isLockedField(qid){
  return CONFIG.QUESTIONS.some(q =>
    q.type === 'reveal' && qid === q.id + 'a' && isRevealed(q)
  );
}

function flushCurrentInputs(){
  document.querySelectorAll('.q-input').forEach(el=>{
    if(isLockedField(el.dataset.qid)) return;
    record.answers = record.answers || {};
    record.answers[el.dataset.qid] = el.value;
  });
  saveRecord(record);
}

function attachQuestionListeners(q){
  document.querySelectorAll('.q-input').forEach(el=>{
    el.addEventListener('input', debounce(async ()=>{
      if(isLockedField(el.dataset.qid)) return;
      record.answers = record.answers || {};
      record.answers[el.dataset.qid] = el.value;
      await saveRecord(record);
    }, 800));
  });
  document.querySelectorAll('.no-paste').forEach(el=>{
    ['paste','drop'].forEach(evt=>{
      el.addEventListener(evt, (e)=>{
        e.preventDefault();
        recordPasteViolation();
      });
    });
    el.addEventListener('contextmenu', (e)=> e.preventDefault());
  });

}

/* A reveal-type question stays locked until the candidate clicks Next once. */
function isRevealed(q){
  return !!(record.answers && record.answers[q.id + '_revealed']);
}

async function revealSection(q){
  record.answers = record.answers || {};
  record.answers[q.id + '_revealed'] = 'yes';
  await saveRecord(record);
  /* Re-render: Part A comes back read-only, Part B is added to the page. */
  renderQuestionPage(currentPage);
  const section = document.getElementById('reveal-section');
  if(section){
    section.scrollIntoView({ behavior:'smooth', block:'start' });
  }
}

function debounce(fn, wait){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
}

function tick(){
  const remaining = timeRemainingMs();
  const timerEl = document.getElementById('timer');
  if(!timerEl) return;
  timerEl.textContent = fmtTime(remaining);
  if(remaining <= 60000) timerEl.classList.add('low');
  if(remaining <= 0){
    clearInterval(timerInterval);
    finishTest(true);
  }
}

function attemptSubmit(auto){
  if(!auto){
    const missing = [];
    CONFIG.QUESTIONS.forEach(q=>{
      if(q.optional) return;
      if(q.type === 'linktext'){
        const linkVal = (record.answers && record.answers[q.id + '_link']) || '';
        const textVal = (record.answers && record.answers[q.id + '_text']) || '';
        if(!linkVal.trim() || !textVal.trim()) missing.push(q.label);
      } else if(q.type === 'reveal'){
        const aVal = (record.answers && record.answers[q.id + 'a']) || '';
        const bVal = (record.answers && record.answers[q.id + 'b']) || '';
        if(!aVal.trim() || !bVal.trim()) missing.push(q.label);
      } else {
        const val = (record.answers && record.answers[q.id]) || '';
        if(!val.trim()) missing.push(q.label);
      }
    });
    if(missing.length){
      const err = document.getElementById('submit-error');
      err.textContent = `Please complete: ${missing.join(', ')}`;
      err.style.display = 'block';
      return;
    }
  }
  finishTest(auto);
}

async function recordViolation(type, opts={}){
  violations += 1;
  record.violations = violations;
  record.violationLog = record.violationLog || [];
  record.violationLog.push({ type, at: new Date().toISOString() });
  await saveRecord(record);
  updateFlagUI();
  if(!opts.silent){
    showBanner(`Pasting is disabled for this question - please type your answer.`);
  }
}

let lastPasteViolationAt = 0;
function recordPasteViolation(){
  const now = Date.now();
  if(now - lastPasteViolationAt < 1500) return; // collapse near-simultaneous paste/drop events into one flag
  lastPasteViolationAt = now;
  recordViolation('blocked paste attempt', { silent: false });
}

/* Flags are recorded silently and shown only in the admin view.
   Nothing about them is surfaced to the candidate. */
function updateFlagUI(){ /* intentionally empty */ }

function showBanner(msg){
  const b = document.getElementById('banner');
  if(!b) return;
  b.textContent = msg;
  b.classList.add('show');
}

let monitorsAttached = false;
let hiddenTimer = null;

/* Tab-switch / window-closure monitoring is only active on Q1 and Q2, per the
   notice shown on the entry page. It's intentionally turned off on Q3. */
function isViolationTrackedPage(){
  const q = CONFIG.QUESTIONS[currentPage];
  return q && q.id !== 'q3';
}

function attachMonitors(){
  if(monitorsAttached) return;
  monitorsAttached = true;

  /* Single source of truth for tab-switch detection. A switch only counts as
     one flag, and only if the tab stays hidden for more than 2 seconds -
     a quick accidental switch (or the fullscreen exit that naturally
     accompanies switching tabs) won't trigger a flag on its own. */
  document.addEventListener('visibilitychange', ()=>{
    if(!record || record.status !== 'in_progress') return;
    if(!isViolationTrackedPage()) return;

    if(document.hidden){
      if(hiddenTimer) clearTimeout(hiddenTimer);
      hiddenTimer = setTimeout(()=>{
        recordViolation('tab switched / window minimized', { silent: true });
        hiddenTimer = null;
      }, 2000);
    } else {
      if(hiddenTimer){ clearTimeout(hiddenTimer); hiddenTimer = null; }
    }
  });
}

function requestFullscreenSoft(){
  try{
    const el = document.documentElement;
    if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
  }catch(e){}
}

async function finishTest(auto){
  clearInterval(timerInterval);
  document.querySelectorAll('.q-input').forEach(el=>{
    if(isLockedField(el.dataset.qid)) return;
    record.answers = record.answers || {};
    record.answers[el.dataset.qid] = el.value;
  });
  record.status = 'submitted';
  record.submittedTime = new Date().toISOString();
  await saveRecord(record);
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  renderDone(auto);
}

function renderDone(auto){
  app.innerHTML = `
    <div class="panel center">
      <div class="ok-icon">✓</div>
      <h1>${auto ? "Time's up: submitted automatically" : 'Submitted'}</h1>
      <div class="sub">Your response has been recorded. You can close this window.</div>
    </div>
  `;
}

function renderAdminLogin(){
  app.innerHTML = `
    <div class="eyebrow">Test Portal</div>
    <h1>Admin</h1>
    <div class="panel">
      <label>Password</label>
      <input type="password" id="admin-pass">
      <button class="btn" id="admin-go">View submissions</button>
      <div id="admin-err" style="color:var(--danger); font-size:13px; margin-top:10px; display:none;">Incorrect password.</div>
    </div>
    <div class="footer-link"><a href="#" id="back-link">Back to test</a></div>
  `;
  document.getElementById('back-link').onclick = (e)=>{ e.preventDefault(); renderEntry(); };
  document.getElementById('admin-go').onclick = async ()=>{
    const pass = document.getElementById('admin-pass').value;
    if(pass !== CONFIG.ADMIN_PASSWORD){
      document.getElementById('admin-err').style.display = 'block';
      return;
    }
    await renderAdminList();
  };
}

async function renderAdminList(){
  app.innerHTML = `<div class="eyebrow">Test Portal</div><h1>Submissions</h1><div class="panel"><div style="color:var(--text-dim);font-size:13px;">Loading…</div></div>`;
  const records = await listRecords();
  records.sort((a,b)=> new Date(b.startTime) - new Date(a.startTime));

  const rows = records.map(r=>{
    const statusPill = r.status === 'submitted' ? `<span class="pill submitted">submitted</span>` : `<span class="pill progress">in progress</span>`;
    const violPill = r.violations > 0 ? `<span class="pill violations">${r.violations} flags</span>` : '-';
    return `<tr>
      <td>${escapeHtml(r.name)}<br><span style="color:var(--text-dim)">${escapeHtml(r.email)}</span></td>
      <td>${new Date(r.startTime).toLocaleString()}</td>
      <td>${r.submittedTime ? new Date(r.submittedTime).toLocaleString() : '-'}</td>
      <td>${statusPill}</td>
      <td>${violPill}</td>
      <td><button class="btn btn-ghost" style="margin-top:0;padding:6px 10px;font-size:12px;" onclick="viewAnswer('${r.email.replace(/'/g,"\\'")}')">View</button></td>
    </tr>`;
  }).join('');

  window.__adminRecords = records;

  app.innerHTML = `
    ${!usingBackend ? `<div class="config-warn">Not connected to Google Sheets. Showing artifact storage only.</div>` : ''}
    <div class="eyebrow">Test Portal</div>
    <h1>Submissions (${records.length})</h1>
    <div class="panel" style="overflow-x:auto;">
      <table>
        <thead><tr><th>Candidate</th><th>Started</th><th>Submitted</th><th>Status</th><th>Flags</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" style="color:var(--text-dim)">No submissions yet.</td></tr>'}</tbody>
      </table>
    </div>
    <div id="answer-detail"></div>
    <div class="footer-link"><a href="#" id="back-link">Back to test</a></div>
  `;
  document.getElementById('back-link').onclick = (e)=>{ e.preventDefault(); renderEntry(); };
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

window.viewAnswer = function(email){
  const rec = (window.__adminRecords || []).find(r=>r.email === email);
  if(!rec) return;
  const el = document.getElementById('answer-detail');
  const logRows = (rec.violationLog||[]).map(v=>`<tr><td>${v.type}</td><td>${new Date(v.at).toLocaleString()}</td></tr>`).join('');
  const answerBlocks = CONFIG.QUESTIONS.map(q=>{
    if(q.type === 'linktext'){
      const linkVal = (rec.answers && rec.answers[q.id + '_link']) || '(blank)';
      const textVal = (rec.answers && rec.answers[q.id + '_text']) || '(blank)';
      return `<div class="q-block">
        <h2>${q.label}</h2>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">Google Sheets link</div>
        <div class="task-prompt">${escapeHtml(linkVal)}</div>
        <div style="font-size:12px;color:var(--text-dim);margin:10px 0 4px;">Summary</div>
        <div class="task-prompt">${escapeHtml(textVal)}</div>
      </div>`;
    }
    if(q.type === 'reveal'){
      const aVal = (rec.answers && rec.answers[q.id + 'a']) || '(blank)';
      const bVal = (rec.answers && rec.answers[q.id + 'b']) || '(blank)';
      return `<div class="q-block">
        <h2>${q.label}</h2>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">Part A (before seeing the evidence)</div>
        <div class="task-prompt">${escapeHtml(aVal)}</div>
        <div style="font-size:12px;color:var(--text-dim);margin:10px 0 4px;">Part B (after seeing the evidence)</div>
        <div class="task-prompt">${escapeHtml(bVal)}</div>
      </div>`;
    }
    const val = (rec.answers && rec.answers[q.id]) || '(blank)';
    return `<div class="q-block"><h2>${q.label}</h2><div class="task-prompt">${escapeHtml(val)}</div></div>`;
  }).join('');
  el.innerHTML = `
    <div class="panel" style="margin-top:16px;">
      <div class="eyebrow">${escapeHtml(rec.name)}'s answers</div>
      ${rec.preTestLink ? `<div class="q-block"><h2>GitHub / project link</h2><div class="task-prompt">${escapeHtml(rec.preTestLink)}</div></div>` : ''}
      ${answerBlocks}
      ${logRows ? `<div class="eyebrow" style="margin-top:6px;">Flag log</div><table><thead><tr><th>Type</th><th>Time</th></tr></thead><tbody>${logRows}</tbody></table>` : ''}
    </div>
  `;
};

/* The admin view is no longer linked from the entry page. Reach it by adding
   #admin to the end of the portal URL, e.g. https://yoursite.com/#admin
   The password prompt still applies. */
if(location.hash.toLowerCase() === '#admin'){
  renderAdminLogin();
} else {
  renderEntry();
}
</script>
